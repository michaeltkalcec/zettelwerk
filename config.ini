; Konfiguration des PDF-Managers. Nach Änderungen den Server neu starten.
; Relative Pfade beziehen sich auf den Ordner, in dem server.py liegt.

[pdf-manager]
; Ordner mit den PDFs (wird rekursiv durchsucht), z. B. /mnt/Michi/Dokumente
root = Docs

; SQLite-Datenbank mit den Tags
db = data/pdfmanager.db

; Adresse und Port des Webservers (0.0.0.0 = im ganzen Netz erreichbar)
host = 0.0.0.0
port = 8800

; Optionales Passwort (Browser fragt per Login-Dialog, Benutzername beliebig). Leer = kein Schutz.
password =

; Nach so vielen Sekunden wird der Ordner automatisch neu eingelesen
scan_ttl = 120
